<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111c" />
      <stop offset="100%" stop-color="#131c2e" />
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142036" />
      <stop offset="100%" stop-color="#0f1728" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <g stroke="#1b283f" stroke-width="1" opacity="0.4">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#0d1627" stroke="#243552" stroke-width="1" />
  <rect x="25" y="15" width="40" height="40" rx="8" fill="url(#cyanBlueGrad)" filter="url(#glow)" />
  <text x="45" y="42" fill="#0b111c" font-family="Inter, sans-serif" font-weight="900" font-size="22" text-anchor="middle">⚙️</text>
  <text x="80" y="38" fill="#ffffff" font-family="Inter, sans-serif" font-weight="800" font-size="19">MTConnectForge Pro</text>
  <text x="80" y="54" fill="#94a3b8" font-family="Inter, sans-serif" font-weight="500" font-size="12">ANSI/MTC1.4-2018 (MTConnect v2.x) Semantic Machine Tool Studio &amp; OEE Analytics (Digital Twin / umati)</text>

  <!-- Top Badge -->
  <rect x="915" y="18" width="260" height="34" rx="17" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
  <circle cx="933" cy="35" r="5" fill="#10b981" />
  <text x="947" y="40" fill="#10b981" font-family="Inter, sans-serif" font-weight="600" font-size="12">ANSI/MTC1.4 &amp; ISO 13399 Compliant</text>

  <!-- Sub Navigation Tabs -->
  <rect x="0" y="70" width="1200" height="45" fill="#0a1322" stroke="#243552" stroke-width="1" />
  <text x="40" y="98" fill="#00f2fe" font-family="Inter, sans-serif" font-weight="700" font-size="13">MTConnect Agent Stream</text>
  <line x1="35" y1="113" x2="200" y2="113" stroke="#00f2fe" stroke-width="3" />
  <text x="235" y="98" fill="#94a3b8" font-family="Inter, sans-serif" font-weight="600" font-size="13">5-Axis Digital Twin</text>
  <text x="410" y="98" fill="#94a3b8" font-family="Inter, sans-serif" font-weight="600" font-size="13">OEE &amp; Energy Analytics</text>
  <text x="615" y="98" fill="#94a3b8" font-family="Inter, sans-serif" font-weight="600" font-size="13">Cutting Tool Assets (ISO 13399)</text>
  <text x="850" y="98" fill="#94a3b8" font-family="Inter, sans-serif" font-weight="600" font-size="13">10-Point Auditor</text>
  <text x="1010" y="98" fill="#94a3b8" font-family="Inter, sans-serif" font-weight="600" font-size="13">Python CLI</text>

  <!-- Left Main Card: 5-Axis Machine Tool Digital Twin -->
  <rect x="30" y="140" width="670" height="495" rx="12" fill="url(#cardGrad)" stroke="#243552" stroke-width="1" />
  <text x="55" y="175" fill="#ffffff" font-family="Inter, sans-serif" font-weight="700" font-size="16">5-Axis Simultaneous Machining Center (Digital Twin View)</text>
  <text x="585" y="175" fill="#10b981" font-family="Inter, sans-serif" font-weight="600" font-size="12">● Execution: ACTIVE</text>

  <!-- Machine Visual View -->
  <rect x="50" y="195" width="630" height="260" rx="8" fill="#060b13" stroke="#243552" stroke-width="1" />

  <!-- Rotary C-Table (Cyan Circle) -->
  <circle cx="365" cy="330" r="75" fill="#141e31" stroke="#38bdf8" stroke-width="2.5" />
  <text x="365" y="335" fill="#94a3b8" font-family="Inter, sans-serif" font-weight="700" font-size="11" text-anchor="middle">ROTARY TABLE (C: 90.0°)</text>

  <!-- Trunnion A-Axis Arc -->
  <path d="M 270 330 A 95 95 0 0 1 460 330" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6" />
  <text x="365" y="240" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">A-AXIS TRUNNION (+15.0°)</text>

  <!-- Spindle Tool Head -->
  <rect x="353" y="230" width="24" height="45" rx="3" fill="#00f2fe" />
  <polygon points="359,275 371,275 365,295" fill="#f43f5e" />
  <text x="365" y="220" fill="#ffffff" font-family="JetBrains Mono, monospace" font-weight="800" font-size="11" text-anchor="middle">TOOL T04 (8,500 RPM)</text>

  <!-- Kinematic Position Overlay -->
  <rect x="65" y="210" width="200" height="115" rx="6" fill="rgba(11, 17, 28, 0.9)" stroke="#243552" stroke-width="1" />
  <text x="75" y="230" fill="#00f2fe" font-family="JetBrains Mono, monospace" font-weight="700" font-size="11">ACTUAL POSITION</text>
  <text x="75" y="250" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="10">X: 125.402 mm</text>
  <text x="75" y="268" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="10">Y: -48.215 mm</text>
  <text x="75" y="286" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="10">Z: 310.880 mm</text>
  <text x="75" y="304" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="10">Spindle Load: 42.5%</text>

  <!-- Live XML Payload Box -->
  <rect x="50" y="475" width="630" height="135" rx="6" fill="#060b13" stroke="#243552" stroke-width="1" />
  <text x="70" y="500" fill="#00f2fe" font-family="JetBrains Mono, monospace" font-weight="700" font-size="11">&lt;MTConnectStreams xmlns="urn:mtconnect.org:MTConnectStreams:2.1"&gt;</text>
  <text x="70" y="522" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">• &lt;Execution dataItemId="d_exec" sequence="10002"&gt;ACTIVE&lt;/Execution&gt;</text>
  <text x="70" y="542" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">• &lt;RotaryVelocity dataItemId="d_srpm" subType="ACTUAL"&gt;8500.0&lt;/RotaryVelocity&gt;</text>
  <text x="70" y="562" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="10">• &lt;Position dataItemId="d_x" subType="ACTUAL" units="MILLIMETER"&gt;125.402&lt;/Position&gt;</text>
  <text x="70" y="582" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">• &lt;Condition&gt;&lt;Normal dataItemId="d_sys_c" type="SYSTEM" /&gt;&lt;/Condition&gt;</text>
  <text x="70" y="600" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="10">✓ Stream Buffer: 131,072 Events | Monotonic Sequence #10005</text>

  <!-- Right Side Cards: OEE KPIs & Tool Assets -->
  <rect x="725" y="140" width="445" height="495" rx="12" fill="url(#cardGrad)" stroke="#243552" stroke-width="1" />
  <text x="750" y="175" fill="#ffffff" font-family="Inter, sans-serif" font-weight="700" font-size="16">OEE &amp; Cutting Tool Telemetry</text>

  <!-- KPI Badges -->
  <g transform="translate(750, 200)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="190" height="85" rx="8" fill="#0d1627" stroke="#243552" stroke-width="1" />
    <text x="95" y="40" fill="#00f2fe" font-family="JetBrains Mono, monospace" font-weight="800" font-size="22" text-anchor="middle">83.4%</text>
    <text x="95" y="65" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">OVERALL OEE SCORE</text>

    <!-- Box 2 -->
    <rect x="205" y="0" width="190" height="85" rx="8" fill="#0d1627" stroke="#243552" stroke-width="1" />
    <text x="300" y="40" fill="#10b981" font-family="JetBrains Mono, monospace" font-weight="800" font-size="22" text-anchor="middle">85.4%</text>
    <text x="300" y="65" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">AVAILABILITY (IN-CUT)</text>

    <!-- Box 3 -->
    <rect x="0" y="100" width="190" height="85" rx="8" fill="#0d1627" stroke="#243552" stroke-width="1" />
    <text x="95" y="140" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-weight="800" font-size="22" text-anchor="middle">84.5 min</text>
    <text x="95" y="165" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">TOOL T04 REMAINING</text>

    <!-- Box 4 -->
    <rect x="205" y="100" width="190" height="85" rx="8" fill="#0d1627" stroke="#243552" stroke-width="1" />
    <text x="300" y="140" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-weight="800" font-size="22" text-anchor="middle">100%</text>
    <text x="300" y="165" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">AUDIT COMPLIANCE</text>
  </g>

  <!-- CLI Code Preview -->
  <rect x="750" y="405" width="395" height="210" rx="8" fill="#060b13" stroke="#243552" stroke-width="1" />
  <text x="765" y="430" fill="#00f2fe" font-family="JetBrains Mono, monospace" font-size="11">$ ./build/mtconnect-cli.py oee --operating 410</text>
  <text x="765" y="450" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">[OK] Availability: 85.4% | Perf: 91.1% | Qual: 97.5%</text>
  <text x="765" y="470" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="10">[OK] Overall OEE: 75.8% (Target: World-Class 85%)</text>
  <text x="765" y="495" fill="#00f2fe" font-family="JetBrains Mono, monospace" font-size="11">$ ./build/mtconnect-cli.py probe</text>
  <text x="765" y="515" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">[OK] 5-Axis Component Tree Verified</text>
  <text x="765" y="540" fill="#00f2fe" font-family="JetBrains Mono, monospace" font-size="11">$ ./build/mtconnect-cli.py audit</text>
  <text x="765" y="560" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="10">[PASS] 10/10 Normative ANSI/MTC1.4 Rules Verified</text>
  <text x="765" y="590" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="10">● Interoperable with Mazak Smooth, Fanuc FOCAS, Siemens Sinumerik</text>
</svg>
